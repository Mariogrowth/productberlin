name: Seed mock data
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Database to seed (does not replace published data)
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cf -- migrate "$TARGET_ENV"
      - run: npm run cf -- seed "$TARGET_ENV"
