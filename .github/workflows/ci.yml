name: Checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dist-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            api-worker/build/dist/js/productionLibrary/
            webApp/build/dist/js/productionExecutable/
