name: Deploy Cloudflare
run-name: Deploy ${{ inputs.environment || 'production' }} from ${{ github.ref_name }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      seed_mock_data:
        description: Seed demo data after deployment (first setup only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.DEPLOY_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      BUILD_SHA: ${{ github.sha }}
      BRANDFETCH_CLIENT_ID: ${{ vars.BRANDFETCH_CLIENT_ID }}
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-dist-${{ github.sha }}
          path: .
      - name: Validate deployment configuration and artifacts
        run: |
          node scripts/check-deployment.mjs
          npm run cf -- config "$TARGET_ENV"
      - name: Check Worker bundle before changing D1
        run: npm run cf -- deploy-check "$TARGET_ENV"
      - name: Apply compatible schema migrations
        run: npm run cf -- migrate "$TARGET_ENV"
      - name: Deploy Worker and website
        run: npm run cf -- deploy "$TARGET_ENV"
      - name: Seed demo data when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_mock_data }}
        run: npm run cf -- seed "$TARGET_ENV"
      - name: Verify deployment, assets and commit version
        run: node scripts/smoke.mjs
        env:
          REQUIRE_RANKING: ${{ inputs.seed_mock_data && 'true' || 'false' }}
      - name: Write deployment summary
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const { GITHUB_STEP_SUMMARY, TARGET_ENV, BUILD_SHA, DEPLOY_URL } = process.env;
          appendFileSync(GITHUB_STEP_SUMMARY, [
            `### Product.berlin deployed to ${TARGET_ENV}`,
            '',
            `Website: ${DEPLOY_URL}`,
            `Commit: ${BUILD_SHA}`,
            '',
            'Uploaded the Kotlin/JS Worker and website assets, applied D1 migrations, and passed HTTP smoke checks.',
            '',
          ].join('\n'));
          JS
